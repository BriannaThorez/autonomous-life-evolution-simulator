  - id: GFX-003
    title: 'WebGL2 HPC Simulation Core: Three.js + Rapier WASM + GPGPU'
    category: Rendering & Compute & Physics
    status: pending
    user_data: >-
      Full architectural pivot from experimental WebGPU to WebGL2 High-Performance
      Compute (HPC) via Three.js WebGLRenderer + Rapier WASM physics + GPGPU Data Textures.
      Dedicated GPU worker thread, feature-sliced implementation, industry-leading performance targets.
    additional_context: 'WebGL2 + GLSL GPGPU + Rapier WASM + OffscreenCanvas gpu.worker.ts + SharedArrayBuffer'
    design_pattern: Feature Slice Design (vertical slices, each independently testable)
    axiomatic_intent: >-
      To establish a hyper-stable, ultra-high-throughput WebGL2 rendering and compute pipeline. 
      This enables (1) GPGPU floating-point texture pipelines for parallel vector state processing, 
      (2) Rapier WASM (SIMD) for deterministic physics and brain logic, 
      (3) Hybrid rendering merging Three.js meshes with FullScreen Quad GLSL SDF Raymarching, 
      (4) O(log N) interaction via Three.js Raycaster, and (5) a tri-threaded architecture 
      guaranteeing zero main-thread contention.
    formal_proof:
      premise_1: >-
        Standard CPU iteration via JavaScript limits agent count to ~500. WebGL2 GPGPU via 
        ping-pong FBOs and RGBA32F textures parallelizes state updates across GPU fragment 
        pipelines, matching WebGPU compute throughput.
      premise_2: >-
        Rapier WASM (SIMD) provides Rust-compiled deterministic rigid-body and soft-body 
        dynamics with automatic collision detection at near-native speed, critical for 
        biological integrity.
      premise_3: >-
        TSL (Three Shading Language) allows modern shader logic to be transpiled to GLSL 
        today while remaining bit-compatible with future WebGPU (WGSL) targets.
      premise_4: >-
        SharedArrayBuffer enables zero-copy synchronization between the WASM simulation 
        thread and the WebGL2 render worker PBOs.
      conclusion: >-
        A tri-threaded WebGL2 HPC architecture mathematically guarantees the 1500+ agent 
        performance target while providing a robust future-proofing path via TSL.
    forensic_path:
      slice_1:
         name: 'Foundation: WebGL2 Renderer + Offscreen GPU Worker'
         steps:
           step_1: 'Initialize standard Three.js (WebGLRenderer) configured for WebGL2 context.'
           step_2: 'Install @dimforge/rapier3d-compat (WASM-SIMD) and verify availability.'
           step_3: 'Create gpu.worker.ts with OffscreenCanvas and WebGL2-fallback protocol.'
           step_4: 'Update SimulationCanvas.tsx to transfer canvas ownership to gpu.worker.'
           step_5: 'Implement Three.js Scene, OrthographicCamera, and 60FPS render loop.'
           step_6: 'Forward raw DOM events to worker to drive OrbitControls camera math.'
         verification: 'Offscreen WebGL2 context renders at 60FPS. OrbitControls are stable.'
      slice_2:
         name: 'Entity Rendering: Instanced Flora + Dynamic SDF Raymarching'
         steps:
           step_1: 'Implement Three.js InstancedMesh for 5000+ Flora with TSL-defined shaders.'
           step_2: 'Create a FullScreen Quad for GPGPU-driven SDF Raymarching of Jelly organisms.'
           step_3: 'Compute organic "metaball" merging (smin) in GLSL driven by GPGPU textures.'
           step_4: 'Implement momentum-based warping (shear/scale) driven by WASM velocity vectors.'
           step_5: 'Port sensory overlays to TSL nodes for modular visual toggling.'
         verification: '5000+ flora + 1500+ raymarched jellies render at <12ms total frame time.'
      slice_3:
         name: 'Logic & Physics: WASM-SIMD Integration'
         steps:
           step_1: 'Migrate SimulationEngine.update() logic to sim.worker.ts (WASM thread).'
           step_2: 'Map organisms to Rapier dynamic bodies; flora to fixed colliders.'
           step_3: 'Implement SharedArrayBuffer (SAB) for agent state (Pos/Rot/Vel/DNA).'
           step_4: 'WASM thread writes to SAB; GPU worker reads SAB to update DataTextures/PBOs.'
           step_5: 'Implement Rapier contact callbacks for biological event triggers (Eat/Mate).'
         verification: 'Physics loop executes @ 60Hz. Zero-copy state sync confirmed.'
      slice_4:
